<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Foundry Training Complex</title>
  <desc id="desc">Isometric blueprint illustration of a three-lane industrial training compound.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27323a"/><stop offset="1" stop-color="#151d24"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53616a"/><stop offset="1" stop-color="#303d46"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69767a"/><stop offset="1" stop-color="#3e4b52"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0a932"/><stop offset="1" stop-color="#ad641d"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91a1a2" stroke-opacity=".12" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="420" fill="url(#bg)"/>
  <path d="M0 345L450 105 900 345v75H0Z" fill="#111920"/>
  <path d="M0 345L450 105 900 345" fill="none" stroke="#87928d" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 345L450 105 900 345" fill="url(#grid)" opacity=".65"/>
  <g opacity=".35" stroke="#b4beb8" stroke-width="1"><path d="M55 372L450 164 846 372"/><path d="M145 404L450 244 755 404"/><path d="M170 315L450 168 730 315"/></g>

  <!-- three north-south lanes -->
  <g fill="#202b32" stroke="#88948f" stroke-opacity=".32" stroke-width="2">
    <path d="M158 334L450 178 485 198 196 356Z"/>
    <path d="M329 385L450 320 450 178 415 198 415 299 292 365Z"/>
    <path d="M531 385L450 341 450 178 485 198 485 320 567 365Z"/>
    <path d="M704 334L450 198 415 218 666 356Z"/>
  </g>
  <g fill="none" stroke="#c6b889" stroke-opacity=".42" stroke-width="3" stroke-dasharray="14 12"><path d="M189 332L450 193"/><path d="M450 329V193"/><path d="M711 332L450 193"/></g>

