  <g filter="url(#shadow)">
    <path d="M593 203l135-75 127 68-136 76Z" fill="url(#roof)" stroke="#e5d6ad" stroke-width="3"/>
    <path d="M593 203v82l126 75v-88Z" fill="#37454d" stroke="#d7c89f" stroke-width="2"/>
    <path d="M719 277l136-81v83l-136 81Z" fill="#26353d" stroke="#b9b394" stroke-width="2"/>
    <path d="M626 205l102-57 96 52-103 58Z" fill="#212c33" stroke="#8f9e9a" stroke-width="2"/>
