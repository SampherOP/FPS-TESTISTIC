    <path d="M45 196v85l134 76v-81Z" fill="#37454d" stroke="#d7c89f" stroke-width="2"/>
    <path d="M179 276l128-73v82l-128 72Z" fill="#26353d" stroke="#b9b394" stroke-width="2"/>
