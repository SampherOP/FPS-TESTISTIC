  <g fill="url(#amber)" stroke="#f3d38a" stroke-width="2">
    <path d="M250 258l49-27 43 24-49 28Z"/><path d="M250 258v34l43 24v-33Z"/><path d="M293 282l49-27v34l-49 27Z"/>
    <path d="M560 231l49 27-43 24-49-27Z"/><path d="M560 231v34l-43-24v34l43 24v-34l49-27v34l-49 27Z" fill="#bc7020"/>
    <path d="M274 334l43-24 43 24-43 24Z"/><path d="M274 334v30l43 23v-29Z"/><path d="M317 358l43-24v30l-43 23Z"/>
    <path d="M540 335l43-24 43 23-43 25Z"/><path d="M540 335v30l43 23v-29Z"/><path d="M583 359l43-25v30l-43 24Z"/>
  </g>
  <g stroke="#70451b" stroke-width="2" opacity=".8"><path d="M266 263l45 25M267 274l45 25M573 238l-43 24M573 249l-43 24M286 339l30 17M552 340l30 17"/></g>

  <!-- title and north marker -->
  <g font-family="Arial, sans-serif">
    <text x="28" y="38" fill="#f4e7bf" font-size="21" letter-spacing="5" font-weight="700">FOUNDRY</text>
    <text x="30" y="59" fill="#78dce0" font-size="10" letter-spacing="3">TRAINING COMPLEX</text>
    <path d="M838 32v35M838 32l-7 12h14Z" fill="#e7a630"/><text x="838" y="82" text-anchor="middle" fill="#f4e7bf" font-size="10" letter-spacing="2">N</text>
  </g>
  <g opacity=".6" fill="none" stroke="#e9d9ad" stroke-width="2"><path d="M24 390h130"/><path d="M24 384v12M154 384v12"/></g>
</svg>
