  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g><circle cx="450" cy="141" r="23" fill="#172228" stroke="#e9d9ad" stroke-width="3"/><circle cx="450" cy="141" r="14" fill="none" stroke="#e7a630" stroke-width="4"/><path d="M450 122v38M431 141h38" stroke="#78dce0" stroke-width="2"/><text x="450" y="112" font-size="14" fill="#f4e7bf">A</text></g>
    <g><circle cx="450" cy="257" r="23" fill="#172228" stroke="#e9d9ad" stroke-width="3"/><circle cx="450" cy="257" r="14" fill="none" stroke="#e7a630" stroke-width="4"/><path d="M450 238v38M431 257h38" stroke="#78dce0" stroke-width="2"/><text x="450" y="228" font-size="14" fill="#f4e7bf">B</text></g>
    <g><circle cx="450" cy="344" r="23" fill="#172228" stroke="#e9d9ad" stroke-width="3"/><circle cx="450" cy="344" r="14" fill="none" stroke="#e7a630" stroke-width="4"/><path d="M450 325v38M431 344h38" stroke="#78dce0" stroke-width="2"/><text x="450" y="315" font-size="14" fill="#f4e7bf">C</text></g>
  </g>

